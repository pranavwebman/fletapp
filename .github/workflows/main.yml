name: Build Flet Android APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      # FIX 1: We hardcode Flutter 3.44.8 so Flet doesn't throw a version mismatch
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.8'
          channel: 'stable'

      - name: Install Flet
        run: |
          python -m pip install --upgrade pip
          pip install flet

      # FIX 2: Added '--no-interactive' so Flet never pauses to ask for console input
      - name: Build APK
        run: |
          flet build apk --no-interactive

      # This step remains the same to upload your final APK
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Flet-Android-APK
          path: build/apk/app-release.apk
